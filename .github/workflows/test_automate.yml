name: Run Test caseson:  pull_request:    branches:      - masterjobs:  tests:    name: Run test cases    runs-on: ubuntu-latest    steps:      - name: Checkout Laravel codebase        uses: actions/checkout@v4      - name: Setup PHP        uses: shivammathur/setup-php@v2        with:          php-version: '8.3'          extensions: mbstring, sqlite3, pdo_sqlite      - name: Install Composer        run: composer install --no-interaction --prefer-dist --optimize-autoloader      - name: Create env file        run: cp .env.example .env      - name: Generate app key        run: php artisan key:generate      - name: run test cases        run: php artisan test